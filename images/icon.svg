<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="512" height="512">
  <!-- Tundy's icon: a tuxedo cat with headphones and a "T" collar tag, in the pastel purple theme.
       Drawn with bold shapes and thick lines, and scaled up 115% inside the square, so it stays clear at the 64 px the plugin installer shows. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2444"/>
      <stop offset="1" stop-color="#1A1424"/>
    </linearGradient>
    <clipPath id="sq"><rect width="160" height="160" rx="34"/></clipPath>
  </defs>
  <rect width="160" height="160" rx="34" fill="url(#bg)"/>
  <g clip-path="url(#sq)"><g transform="translate(80 92) scale(1.15) translate(-80 -92)">
    <!-- ears -->
    <path d="M27 76 L32 20 L69 49 Z" fill="#544A6C"/>
    <path d="M35 64 L38 33 L60 50 Z" fill="#F4A9D2"/>
    <path d="M133 76 L128 20 L91 49 Z" fill="#544A6C"/>
    <path d="M125 64 L122 33 L100 50 Z" fill="#F4A9D2"/>
    <!-- headphone band -->
    <path d="M25 82 C23 18 137 18 135 82" fill="none" stroke="#C6B5F7" stroke-width="9" stroke-linecap="round"/>
    <!-- head and white blaze -->
    <ellipse cx="80" cy="91" rx="57" ry="46" fill="#544A6C"/>
    <path d="M73 45 C76 62 74 80 70 94 C62 103 54 113 59 124 C68 136 92 136 101 124 C106 113 98 103 90 94 C86 80 84 62 87 45 Z" fill="#F6F1FC"/>
    <!-- squinty eyes -->
    <ellipse cx="53" cy="87" rx="13" ry="6.5" fill="#F6C98C"/>
    <path d="M39 87 Q53 77 67 87 L67 76 L39 76 Z" fill="#544A6C"/>
    <path d="M40 87 Q53 79 66 87" fill="none" stroke="#D8CBFA" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="55.5" cy="89" rx="1.8" ry="3.2" fill="#2A2238"/>
    <ellipse cx="107" cy="87" rx="13" ry="6.5" fill="#F6C98C"/>
    <path d="M93 87 Q107 77 121 87 L121 76 L93 76 Z" fill="#544A6C"/>
    <path d="M94 87 Q107 79 120 87" fill="none" stroke="#D8CBFA" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="104.5" cy="89" rx="1.8" ry="3.2" fill="#2A2238"/>
    <!-- nose and tongue -->
    <path d="M72 101 Q80 95.5 88 101 Q84 109.5 80 110.5 Q76 109.5 72 101 Z" fill="#B48FAA"/>
    <path d="M80 110 V114" stroke="#2A2238" stroke-width="2" stroke-linecap="round"/>
    <path d="M72.5 115 Q80 112.5 87.5 115 Q88.5 127 80 127 Q71.5 127 72.5 115 Z" fill="#F4A9D2"/>
    <path d="M80 116.5 V123" stroke="#E07FB2" stroke-width="1.8" stroke-linecap="round"/>
    <!-- whiskers: two per side, thick enough to survive shrinking -->
    <g fill="none" stroke="#EEE7F8" stroke-width="2.6" stroke-linecap="round">
      <path d="M64 110 Q40 104 14 102"/><path d="M65 116 Q42 120 18 128"/>
      <path d="M96 110 Q120 104 146 102"/><path d="M95 116 Q118 120 142 128"/>
    </g>
    <!-- collar and T tag -->
    <path transform="translate(0 -8)" d="M45 128 Q80 147 115 128" fill="none" stroke="#8EE3C1" stroke-width="8.5" stroke-linecap="round"/>
    <circle transform="translate(0 -8)" cx="80" cy="147" r="10.5" fill="#F6C98C"/>
    <circle transform="translate(0 -8)" cx="80" cy="147" r="10.5" fill="none" stroke="#D9A85E" stroke-width="1.8"/>
    <text transform="translate(0 -8)" x="80" y="151.8" text-anchor="middle" font-size="14" font-weight="800" fill="#4A3A20" font-family="Segoe UI, Arial, sans-serif">T</text>
    <!-- headphone cups -->
    <rect x="13" y="71" width="22" height="38" rx="11" fill="#7A63C2"/>
    <rect x="18" y="77" width="12" height="26" rx="6" fill="#C6B5F7"/>
    <rect x="125" y="71" width="22" height="38" rx="11" fill="#7A63C2"/>
    <rect x="130" y="77" width="12" height="26" rx="6" fill="#C6B5F7"/>
    <!-- music note -->
    <path d="M146 14 v18.5 a5.5 5.5 0 1 1 -3.5 -5.1 v-8.4 l-8.5 2 v11.5 a5.5 5.5 0 1 1 -3.5 -5.1 v-9.4 z" fill="#F4A9D2"/>
  </g></g>
</svg>

